<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="" type="image/x-icon">
    <title>FinUP | Gestão Financeira</title>
</head>

<body>

    <aside id="menuLateral" class="d-flex flex-column align-items-center">

        <nav class="nav flex-column align-items-center gap-3">

            <a href="index.html" class="item-menu ativo" data-bs-toggle="tooltip" data-bs-placement="right"
                data-bs-container="body" data-bs-custom-class="tooltip-finup" data-bs-title="Dashboard">
                <i class="bi bi-house"></i>
            </a>

            <a href="transacoes.html" class="item-menu" data-bs-toggle="tooltip" data-bs-placement="right"
                data-bs-container="body" data-bs-custom-class="tooltip-finup" data-bs-title="Transações">
                <i class="bi bi-arrow-left-right"></i>
            </a>

            <a href="receitas.html" class="item-menu" data-bs-toggle="tooltip" data-bs-placement="right"
                data-bs-container="body" data-bs-custom-class="tooltip-finup" data-bs-title="Receitas">
                <i class="bi bi-graph-up-arrow"></i>
            </a>

            <a href="despesas.html" class="item-menu" data-bs-toggle="tooltip" data-bs-placement="right"
                data-bs-container="body" data-bs-custom-class="tooltip-finup" data-bs-title="Despesas">
                <i class="bi bi-graph-down-arrow"></i>
            </a>

        </nav>

    </aside>


    <div class="container-fluid main-content">

        <header class="container-fluid conteudo d-flex justify-content-between align-items-center mb-4" id="cabecalho">
            <div class=".sm:container">
                <a href="#index.html">
                    <img src="assets/Logo FinUP.png" alt="Logo FinUP" id="logo">
                </a>
            </div>

            <div class="d-flex align-items-center gap-1">
                <span id="saldoDisponivel" class="text-secondary"> Saldo Financeiro: </span>
                <span id="valorSaldo" class="text-secondary text-dark fw-medium"></span>
            </div>
        </header>

        <div class="row g-3" id="Grade">

            <div class="col-12 col-xl-6">
                <div class="card card-chart">
                    <div class="card-body">
                        <h6 class="card-title text-secondary">Evolução do saldo</h6>
                        <div class="chart-box">
                            <canvas id="chartSaldo"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-6">
                <div class="card card-chart">
                    <div class="card-body">
                        <h6 class="card-title text-secondary">Despesas por categoria</h6>
                        <div class="chart-box">
                            <canvas id="chartCategorias"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-6">
                <div class="card card-chart">
                    <div class="card-body">
                        <h6 class="card-title text-secondary">Entradas x Despesas</h6>
                        <div class="chart-box">
                            <canvas id="chartEntradas"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-6">
                <div class="card card-chart">
                    <div class="card-body">
                        <h6 class="card-title text-secondary">Metas de Economia</h6>
                        <div class="chart-box">
                            <canvas id="chartEconomia"></canvas>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

<script src="js/utils.js"></script>
<script src="js/script.js"></script>

</html>

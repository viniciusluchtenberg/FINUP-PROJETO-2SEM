<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

<body>

        <div class=".sm:container">
            <a href="#index.html">
                <img src="assets/Logo FinUP.png" alt="Logo FinUP" id="logo">
            </a>
        </div>

        <div class="d-flex align-items-center gap-1">
            <span id="saldoDisponivel" class="text-secondary"> Saldo Financeiro: </span>
            <span id="valorSaldo" class="text-secondary text-dark fw-medium">R$ 5.345,92</span>
        </div>
    </header>
    
    <aside id="menuLateral" class="d-flex flex-column align-items-center">
        
    <nav class="nav flex-column align-items-center gap-3"
         aria-label="Menu principal">

        <a href="index.html"
           class="item-menu ativo"
           aria-label="Dashboard"
           aria-current="page"
           title="Dashboard">
            <i class="bi bi-house"></i>
        </a>

        <a href="transacoes.html"
           class="item-menu"
           aria-label="Transações"
           title="Transações">

        </a>

           class="item-menu"
           aria-label="Categorias"
           title="Categorias">
            <i class="bi bi-pie-chart"></i>
        </a>

        <a href="#metas"
           class="item-menu"
           aria-label="Metas"
           title="Metas">
            <i class="bi bi-bullseye"></i>
        </a>

    </nav>

</aside>

    
<div class="container-fluid conteudo">
    <div class="row g-3" id="Grade">

        <div class="col-12 col-xl-6">
            <div class="card card-chart">
                <div class="card-body">
                    <h6 class="card-title text-secondary">Evolução do saldo</h6>
                    <div class="chart-box">
                        
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-xl-6">
            <div class="card card-chart">
                <div class="card-body">
                    <h6 class="card-title text-secondary">Despesas por categoria</h6>
                    <div class="chart-box">
                        
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-xl-6">
            <div class="card card-chart">
                <div class="card-body">
                    <h6 class="card-title text-secondary">Entradas x Despesas</h6>
                    <div class="chart-box">
                        
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-xl-6">
            <div class="card card-chart">
                <div class="card-body">
                    <h6 class="card-title text-secondary">Metas de Economia</h6>

                    </div>
                </div>
